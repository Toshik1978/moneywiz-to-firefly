[project]
name = "moneywiz-to-firefly"
version = "1.0.0"
description = "Migrate MoneyWiz exported CSV transaction files to Firefly III"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click==8.3.1",
    "dataclasses-json==0.6.7",
    "firefly-iii-client==6.4.0.0",
    "python-dotenv==1.2.1",
    "sqlalchemy==2.0.46",
    "urllib3==2.6.3",
]

[project.scripts]
moneywiz-to-firefly = "cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat layout: the project is a set of top-level modules and packages
# rather than a single package matching the project name.
only-include = ["cli.py", "helpers.py", "firefly", "moneywiz", "storage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pycodestyle errors, pyflakes, isort, pyupgrade, flake8-bugbear
select = ["E", "F", "I", "UP", "B"]
